# GoReleaser configuration for cwpromql.
# Docs: https://goreleaser.com
version: 2

project_name: cwpromql

before:
  hooks:
    - go mod tidy

builds:
  - id: cwpromql
    main: .
    binary: cwpromql
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/lewinkedrs/cw-otel-cli/internal/cli.version={{ .Version }}

archives:
  - id: cwpromql
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}
    files:
      - README.md
      - LICENSE

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "Merge pull request"
      - "Merge branch"

release:
  github:
    owner: lewinkedrs
    name: cw-otel-cli
  draft: false
  prerelease: auto
  name_template: "v{{ .Version }}"
